# ============================================================
# 场景配置:go2 + 程序化地形(复刻 llm-legged-lab terrain_tool 的 mine 地形)
# 地形参数名与原版 Add* 系列一致;euler 一律用"度"
# ============================================================

robot: go2
spawn: [0.0, 0.0, 0.30]  # 站立高度出生,RL 策略切入更稳
timestep: 0.002
realtime: true

# ---- 可推箱(push_box 的 AddMovableBox:有质量/摩擦,可以被机器人推动)----
objects:
  - name: push box
    type: box
    size: [0.6, 0.8, 0.24]
    pos: [0.8, 0.0, 0.12]
    rgba: [0.82, 0.47, 0.22, 1.0]
    mass: 4.0                       # 千克
    friction: [0.8, 0.6, 0.0]

  - name: red box                   # YOLO 检测演示目标
    type: box
    size: [0.16, 0.16, 0.16]
    pos: [1.2, 0.6, 0.30]
    rgba: [0.85, 0.15, 0.15, 1.0]

# ---- 程序化地形(与原版 mine_terrain_generator 的 demo 布局相同)----
terrain:
  # 斜坡(原版:AddBox + euler pitch -0.5rad ≈ -28.6deg)
  - type: box
    pos: [2.0, 2.0, 0.5]
    euler: [0.0, -28.6, 0.0]
    size: [3.0, 1.5, 0.1]

  # 楼梯
  - type: stairs
    init_pos: [1.0, 4.0, 0.0]
    yaw: 0.0
    width: 0.2
    height: 0.15
    length: 1.5
    stair_nums: 10

  # 悬浮楼梯
  - type: suspend_stairs
    init_pos: [1.0, 6.0, 0.0]
    width: 0.2
    height: 0.15
    length: 1.5
    gap: 0.1
    stair_nums: 10

  # 乱石地(随机方块阵,seed 固定可复现)
  - type: rough_ground
    init_pos: [-2.5, 5.0, 0.0]
    nums: [10, 8]
    seed: 0

  # Perlin 噪声高程图地形(numpy 自实现噪声,无需 noise 包)
  - type: perlin_hfield
    pos: [-1.5, 4.0, 0.0]
    size: [2.0, 1.5]
    height_scale: 0.2
    negative_height: 0.2
    smooth: 100.0
    octaves: 6
    seed: 0

#  # 图片生成高程图地形(图片路径相对项目根,或绝对路径)
#  - type: image_hfield
#    pos: [-1.5, 2.0, 0.0]
#    size: [2.0, 2.0]
#    input_img: assets/terrain_demo.png
#    height_scale: 0.05
#    invert_gray: false

# ---- 相机 ----
cameras:
  - name: head_cam                # 车载前视(挂 BASE = 机器人根 body)
    attach: BASE
    pos: [0.25, 0.0, 0.25]
    lookat: [1.8, 0.0, 0.05]
    fovy: 75
    width: 640
    height: 480

  - name: terrain_cam             # 高处俯瞰整个地形场
    pos: [0.0, -6.0, 5.0]
    track: BASE
    fovy: 70
    width: 960
    height: 540

controller:
  # 策略关节序:RL 观测/动作的关节排列,内部自动映射到 MuJoCo 执行器
  joint_names: [FL_hip_joint, FR_hip_joint, RL_hip_joint, RR_hip_joint,
                FL_thigh_joint, FR_thigh_joint, RL_thigh_joint, RR_thigh_joint,
                FL_calf_joint, FR_calf_joint, RL_calf_joint, RR_calf_joint]
  step_dt: 0.02                     # 控制周期 50Hz
  stiffness: 25.0                   # kp(可标量或 12 个数)
  damping: 0.5                      # kd
  default_joint_pos: [0.1, -0.1, 0.1, -0.1, 0.8, 0.8, 1.0, 1.0, -1.5, -1.5, -1.5, -1.5]
  action_scale: [0.2, 0.2, 0.2, 0.2, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]
  policy: "D:/MyFiles/研0/llm-legged-lab/ModelBackup/TransPolicy/WalkRoughTransfer.pt"
  commands: [0.0, 0.0, 0.0]         # 初始速度指令 vx, vy, wz(上位机可调)
  initial_mode: pd_stand            # damping / force / pd_stand / position / policy

yolo:
  enabled: true
  camera: head_cam
  weights: yolov8s-worldv2.pt
  conf: 0.1
  classes: [box, orange box, red box]   # 加同义词 "box" 能明显提升召回
  interval: 0.5
  save_dir: outputs
