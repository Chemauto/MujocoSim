# ============================================================
# 场景配置:g1 人形机器人 —— 换机器人只改 robot 一行 + 相机挂载点
# ============================================================

robot: g1
timestep: 0.002
realtime: true

objects:
  - name: green ball
    type: sphere
    size: [0.14]
    pos: [1.4, 0.0, 0.20]
    rgba: [0.1, 0.8, 0.3, 1.0]

  - name: orange box
    type: box
    size: [0.15, 0.15, 0.15]
    pos: [1.0, 0.8, 0.30]
    rgba: [0.95, 0.5, 0.1, 1.0]

cameras:
  - name: head_cam                # 人形机器人"头部"相机:挂在躯干上
    attach: torso_link            # g1 的躯干 body;BASE = pelvis 根 body
    pos: [0.05, 0.0, 0.45]        # 头部前上方
    lookat: [1.8, 0.0, 0.3]
    fovy: 90
    width: 640
    height: 480

  - name: overview_cam
    pos: [2.0, -2.0, 2.2]
    track: BASE                   # BASE = 当前机器人的根 body
    fovy: 60
    width: 640
    height: 480

# ---- 控制器(g1 暂未接入 RL 策略,支持 阻尼/力控/PD站立/位控 四种模式)----
controller:
  joint_names: [left_hip_pitch_joint, right_hip_pitch_joint,
                left_hip_roll_joint, right_hip_roll_joint,
                left_hip_yaw_joint, right_hip_yaw_joint,
                left_knee_joint, right_knee_joint,
                left_ankle_pitch_joint, right_ankle_pitch_joint,
                left_ankle_roll_joint, right_ankle_roll_joint]
  step_dt: 0.02
  stiffness: 60.0                   # PD 增益为占位值:g1 站立需按官方参数整定,否则会倾倒
  damping: 2.0
  default_joint_pos: [-0.3, -0.3, 0.0, 0.0, 0.0, 0.0, 0.6, 0.6, -0.3, -0.3, 0.0, 0.0]
  action_scale: 0.25
  policy: ""                        # 填入 g1 的 TorchScript 路径即可启用 RL行走
  commands: [0.0, 0.0, 0.0]
  initial_mode: pd_stand

yolo:
  enabled: true
  camera: head_cam
  weights: yolov8s-worldv2.pt
  conf: 0.15
  interval: 0.5
  save_dir: outputs

# ---- 数据导出(ROS2 风格话题总线,见 docs/common.md)----
data:
  enabled: true
  format: jsonl                   # 每行 {t, topic, data},可直接 pandas 读取
  dir: outputs/data               # 保存目录(相对项目根)
  rate: 50                        # 记录频率(仿真时间 Hz)
  topics: [robot/state, env/state, sensor/height_scan]

